<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Summary - ParkWheely</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">ParkWheely</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/user_dashboard/{{ user }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="/user_summary/{{ user }}">Summary</a></li>
      </ul>
    </div>
    <div class="d-flex align-items-center ms-auto">
      <span class="text-white me-3">Welcome, {{ user }}</span>
      <a href="/edit_profile/{{ user }}" class="btn btn-outline-light btn-sm me-2">Edit Profile</a>
      <a href="/login" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </div>
</nav>

<!-- Page Content -->
<div class="container my-5">
  <h3 class="mb-4">User Booking Summary</h3>
  <canvas id="bookingChart"></canvas>
</div>

<!-- Chart Script -->
<script>
  const chartData = {{ chart_data | tojson | safe }};
  console.log(chartData);

  if (chartData.length > 0) {
    const labels = chartData.map(item => item.user_name);
    const occupied = chartData.map(item => item.occupied);
    const closed = chartData.map(item => item.closed);

    const ctx = document.getElementById('bookingChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Occupied Bookings',
            data: occupied,
            backgroundColor: 'rgba(220, 53, 69, 0.7)' // Red
          },
          {
            label: 'Closed Bookings',
            data: closed,
            backgroundColor: 'rgba(25, 135, 84, 0.7)' // Green
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: 'Occupied vs Closed Bookings by User'
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            precision: 0
          }
        }
      }
    });
  } else {
    console.log("No data available for chart.");
  }
</script>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
