<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Parking Lot - ParkWheely</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">ParkWheely Admin</a>
      <a href="/admin_dashboard" class="btn btn-outline-light btn-sm ms-auto">Dashboard</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container my-5">
    <div class="card mx-auto shadow" style="max-width: 600px;">
      <div class="card-body">
        <h3 class="mb-4">Add a New Parking Lot</h3>

        <form method="POST" action="/add">
          <!-- Location -->
          <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" name="location" required maxlength="32" placeholder="e.g., Delhi, Mumbai">
          </div>

          <!-- Pincode -->
          <div class="mb-3">
            <label for="pin_code" class="form-label">Pincode</label>
            <input type="number" class="form-control" id="pin_code" name="pincode" required placeholder="e.g., 123405">
          </div>

          <!-- Price -->
          <div class="mb-3">
            <label for="price" class="form-label">Price (₹/hr)</label>
            <input type="number" class="form-control" id="price" name="price" required placeholder="e.g., 40">
          </div>

          <!-- Available Spots -->
          <div class="mb-3">
            <label for="available_spots" class="form-label">Available Spots</label>
            <input type="number" class="form-control" id="available_spots" name="available_spots" required placeholder="e.g., 5">
          </div>

          <!-- Action Buttons -->
          <button type="submit" class="btn btn-success">Add Lot</button>
          <a href="/admin_dashboard" class="btn btn-secondary ms-2">Cancel</a>
        </form>

      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
