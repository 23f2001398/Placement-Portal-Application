<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Parking Spot - ParkWheely</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">ParkWheely</a>
    <div class="ms-auto d-flex align-items-center">
      <span class="text-white me-3">Welcome, {{ user }}</span>
      <a href="/user/edit-profile" class="btn btn-outline-light btn-sm me-2">Edit Profile</a>
      <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </div>
</nav>

<!-- Booking Form -->
<div class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-body">
      <h3 class="mb-4">Book Parking Spot - {{ lot.location }}</h3>

      <form method="POST" action="/{{user}}/book/{{ lot.id }}">
        
        <!-- Lot ID (readonly) -->
        <div class="mb-3">
          <label class="form-label">Lot ID</label>
          <p class="form-control-plaintext">{{ lot.id }}</p>
        </div>

        <!-- Spot ID Dropdown -->
        <div class="mb-3">
          <label class="form-label">Available Spot ID</label>
          <select class="form-select" name="spot_id" required>
            {% for spot in available_spots %}
              <option value="{{ spot.id }}">{{ spot.id }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Vehicle Number -->
        <div class="mb-3">
          <label class="form-label">Vehicle Number</label>
          <input type="text" class="form-control" name="vehicle_number" required placeholder="e.g. KA03AB1234">
        </div>

        <!-- User ID (hidden) -->
        <input type="hidden" name="user_id" value="{{ user.id }}">

        <!-- Buttons -->
        <button type="submit" class="btn btn-success">Confirm Booking</button>
        <a href="/user_dashboard/{{user}}" class="btn btn-secondary ms-2">Cancel</a>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
