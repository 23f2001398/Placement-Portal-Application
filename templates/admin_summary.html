<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Summary - ParkWheely Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">ParkWheely Admin</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSummary">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSummary">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/admin_dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/users">Users</a></li>
        <li class="nav-item"><a class="nav-link" href="/search">Search</a></li>
        <li class="nav-item"><a class="nav-link active" href="/summary">Summary</a></li>
        <li class="nav-item"><a class="nav-link" href="/occupied_spots">Occupied Spots</a></li>
      </ul>
      <div class="d-flex align-items-center ms-auto">
        <span class="text-white me-3">Welcome, Admin</span>
        <a href="/login" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </div>
</nav>

<!-- Chart Container -->
<div class="container mt-5">
  <div class="card shadow p-4">
    <h2 class="text-center mb-4">Parking Lot Spot Distribution</h2>
    <canvas id="lotChart" width="400" height="200"></canvas>
  </div>
</div>

<script>
  const chartData = {{ chart_data | tojson | safe }};
  console.log(chartData);

  const labels = chartData.map(item => item.location);
  const occupied = chartData.map(item => item.occupied);
  const available = chartData.map(item => item.available);
  const total = chartData.map(item => item.total);

  const ctx = document.getElementById('lotChart').getContext('2d');
  new Chart(ctx, {
      type: 'bar',
      data: {
          labels: labels,
          datasets: [
              {
                  label: 'Occupied',
                  data: occupied,
                  backgroundColor: 'rgba(220, 53, 69, 0.7)' // red
              },
              {
                  label: 'Available',
                  data: available,
                  backgroundColor: 'rgba(25, 135, 84, 0.7)' // green
              },
              {
                  label: 'Total',
                  data: total,
                  backgroundColor: 'rgba(13, 110, 253, 0.7)' // blue
              }
          ]
      },
      options: {
          responsive: true,
          animation: {
              duration: 800,
              easing: 'easeOutQuart'
          },
          plugins: {
              title: {
                  display: true,
                  text: 'Occupied vs Available vs Total Spots by Parking Lot'
              },
              tooltip: {
                  enabled: true,
                  backgroundColor: 'rgba(0,0,0,0.8)',
                  titleColor: '#fff',
                  bodyColor: '#fff',
                  borderColor: '#eee',
                  borderWidth: 1
              }
          },
          hover: {
              mode: 'nearest',
              intersect: true
          },
          scales: {
              y: {
                  beginAtZero: true,
                  precision: 0,
                  ticks: {
                    stepSize: 1
                  }
              }
          }
      }
  });
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
